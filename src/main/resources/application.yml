quarkus:
  http:
    host: 0.0.0.0
    port: 8081
    cors:
      ~: true
      origins: "*"
      methods: "*"
      headers: "*"
      exposed-headers: "*"

  datasource:
    db-kind: mysql
    username: root
    password:
    jdbc:
      url: jdbc:mysql://localhost:3306/klaso_db

  hibernate-orm:
    database:
      generation: none # ou `validate` si tu utilises liquibase
    log:
      sql: true

  liquibase:
    migrate-at-start: true
    change-log: db/changelog.xml

  log:
    level: INFO
    category:
      "com.klaso":
        level: DEBUG

  # Configuration pour l'envoi d'emails
  mailer:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: 267ab2f4f92cbe    # ton user
    password: 7b907c169c3bc7          # ton password
    ssl: false
    start-tls: REQUIRED
    from: "no-reply@klaso.local"
    mock: false

# Clés JWT
mp:
  jwt:
    verify:
      publickey:
        location: META-INF/publicKey.pem

smallrye:
  jwt:
    sign:
      key:
        location: META-INF/privateKey.pem
