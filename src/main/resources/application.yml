quarkus:
  http:
    port: ${PORT:8081}
    host: 0.0.0.0
    cors:
      ~: true
      origins: "*"
      methods: "GET,POST,PUT,DELETE,OPTIONS"
      headers: "accept,authorization,content-type,x-requested-with"
      exposed-headers: "location,info"
      access-control-max-age: 24H
    limits:
      max-body-size: 10M

  datasource:
    db-kind: mysql
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:}
    jdbc:
      url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:klaso_db}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  hibernate-orm:
    database:
      generation: none
    log:
      sql: true

  liquibase:
    migrate-at-start: true
    change-log: db/changelog.xml

  log:
    level: INFO
    category:
      "com.klaso":
        level: DEBUG

  mailer:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    ssl: false
    start-tls: REQUIRED
    from: ${MAIL_FROM:no-reply@klaso.local}
    mock: false

mp:
  jwt:
    verify:
      publickey:
        location: META-INF/publicKey.pem

smallrye:
  jwt:
    sign:
      key:
        location: META-INF/privateKey.pem