quarkus:
  http:
    host: 0.0.0.0
    port: 8081
    cors:
      ~: true
      origins: "*"
      methods: "*"
      headers: "*"
      exposed-headers: "*"

  datasource:
    db-kind: mysql
    username: root
    password:
    jdbc:
      url: jdbc:mysql://localhost:3306/klaso_db

  hibernate-orm:
    database:
      generation: none # ou `validate` si tu utilises liquibase
    log:
      sql: true

  liquibase:
    migrate-at-start: true
    change-log: db/changelog.xml

  log:
    level: INFO
    category:
      "com.klaso":
        level: DEBUG

  # Configuration pour l'envoi d'emails
  mailer:
    from: noreply@klaso.com
    mock: true # Pour le développement, utilise un mock
    # Pour la production, configurez un vrai serveur SMTP :
    # host: smtp.gmail.com
    # port: 587
    # username: votre-email@gmail.com
    # password: votre-mot-de-passe-app
    # ssl: false
    # tls: true

# Clés JWT
mp:
  jwt:
    verify:
      publickey:
        location: META-INF/publicKey.pem

smallrye:
  jwt:
    sign:
      key:
        location: META-INF/privateKey.pem
